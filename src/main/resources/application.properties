spring.application.name=gaia-api
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.sql.init.mode=never
server.port=8080
gaia.frontend-origin=${GAIA_FRONTEND_ORIGIN:http://localhost:5173}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
gaia.chat.webhook=${GAIA_N8N_WEBHOOK_URL:}
gaia.chat.chave=${GAIA_N8N_WEBHOOK_KEY:}
