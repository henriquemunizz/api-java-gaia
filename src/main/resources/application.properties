
spring.application.name=gaia-api

# Banco de dados Oracle
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.sql.init.mode=never

# Servidor
server.port=${PORT:8080}
server.address=0.0.0.0

# Frontend
gaia.frontend-origin=${GAIA_FRONTEND_ORIGIN:http://localhost:5173}

# Sessão e cookies
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:strict}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Chat com a Gaia
gaia.chat.webhook=${GAIA_N8N_WEBHOOK_URL:}
gaia.chat.chave=${GAIA_N8N_WEBHOOK_KEY:}
